# Chill Shaders 0.2.45 - Iris/OptiFine shader pack settings
name=Chill Shaders
version=0.2.45

# Use Iris' dedicated translucent-entity program when it is available. This
# keeps every entity path synchronized with the opaque mob pass.
iris.features.optional=ENTITY_TRANSLUCENT
author=Chill Shaders contributors

# Main menu and grouped pages. The option names are defined once in lib/settings.glsl.
screen=<profile> [LIGHTING] [SHADOWS] [WATER] [ATMOSPHERE] [POST_PROCESSING] [PERFORMANCE]
screen.columns=2
screen.LIGHTING=EXPOSURE
screen.SHADOWS=SHADOW_RESOLUTION SHADOW_DISTANCE SHADOW_FILTER
screen.WATER=WATER_REFLECTION_STRENGTH WATER_QUALITY WATER_REFLECTIONS
screen.ATMOSPHERE=FOG_DENSITY ATMOSPHERE_QUALITY FOLIAGE_WAVING FOLIAGE_WIND
screen.POST_PROCESSING=BLOOM BLOOM_INTENSITY POST_PROCESSING
screen.PERFORMANCE=SHADOW_RESOLUTION SHADOW_DISTANCE SHADOW_FILTER WATER_QUALITY ATMOSPHERE_QUALITY POST_PROCESSING
screen.LIGHTING.columns=1
screen.SHADOWS.columns=1
screen.WATER.columns=1
screen.ATMOSPHERE.columns=1
screen.POST_PROCESSING.columns=1
screen.PERFORMANCE.columns=1

sliders=EXPOSURE FOG_DENSITY WATER_REFLECTION_STRENGTH FOLIAGE_WAVING BLOOM_INTENSITY

# The recommended default is Chill. Every profile changes real compile-time settings.
profile.Potato=SHADOW_RESOLUTION=1024 SHADOW_DISTANCE=128 SHADOW_FILTER=1 SHADOW_INTERVAL_SIZE=2.0 !BLOOM BLOOM_INTENSITY=0.00 !WATER_REFLECTIONS WATER_REFLECTION_STRENGTH=0.10 WATER_QUALITY=0 ATMOSPHERE_QUALITY=0 FOLIAGE_WAVING=0.40 FOLIAGE_WIND EXPOSURE=1.00 FOG_DENSITY=0.75 POST_PROCESSING=0
profile.Chill=SHADOW_RESOLUTION=2048 SHADOW_DISTANCE=192 SHADOW_FILTER=2 SHADOW_INTERVAL_SIZE=2.0 BLOOM BLOOM_INTENSITY=0.18 WATER_REFLECTIONS WATER_REFLECTION_STRENGTH=0.50 WATER_QUALITY=1 ATMOSPHERE_QUALITY=1 FOLIAGE_WAVING=1.00 FOLIAGE_WIND EXPOSURE=1.00 FOG_DENSITY=1.00 POST_PROCESSING=1
profile.High=SHADOW_RESOLUTION=4096 SHADOW_DISTANCE=256 SHADOW_FILTER=3 SHADOW_INTERVAL_SIZE=2.0 BLOOM BLOOM_INTENSITY=0.30 WATER_REFLECTIONS WATER_REFLECTION_STRENGTH=0.60 WATER_QUALITY=2 ATMOSPHERE_QUALITY=2 FOLIAGE_WAVING=1.20 FOLIAGE_WIND EXPOSURE=1.10 FOG_DENSITY=1.20 POST_PROCESSING=2

# Conservative pipeline options shared by Iris and OptiFine.
oldLighting=false
underwaterOverlay=false
# Render the underside of translucent water so the same optical surface is
# available for reflections both above and below the waterline.
backFace.translucent=true
# Use Minecraft's efficient fancy cloud mesh. gbuffers_clouds softens its
# block texture and side walls into translucent, rounded cirrus.
clouds=fancy
# Preserve the soft alpha gradient produced by the custom cloud fragment pass.
alphaTest.gbuffers_clouds=off
# colortex3 stores cloud coverage data; overwrite it directly.
blend.gbuffers_clouds.colortex3=off
# Clouds attenuate colored emission behind their visible opacity so distant
# lava glow cannot shine through the cloud layer.
blend.gbuffers_clouds.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Entity passes write a compact water-lighting marker to colortex3. It must
# replace the pixel rather than alpha-blend with stale cloud/material data.
blend.gbuffers_entities.colortex3=off
blend.gbuffers_entities_translucent.colortex3=off
# Keep Minecraft's original sun, moon and tiny star geometry. The sky shader
# turns the star quads into brighter pure-white hard-edged pixels.
sun=true
moon=true
stars=true
dynamicHandLight=true

# Smooth biome selectors provide stable Nether fog transitions instead of a
# hard colour seam when the player crosses a biome border.
uniform.float.chillNetherWastes=smooth(70, if(in(biome, BIOME_NETHER_WASTES), 1, 0), 8, 8)
uniform.float.chillCrimsonForest=smooth(71, if(in(biome, BIOME_CRIMSON_FOREST), 1, 0), 8, 8)
uniform.float.chillWarpedForest=smooth(72, if(in(biome, BIOME_WARPED_FOREST), 1, 0), 8, 8)
uniform.float.chillBasaltDeltas=smooth(73, if(in(biome, BIOME_BASALT_DELTAS), 1, 0), 8, 8)
uniform.float.chillSoulValley=smooth(74, if(in(biome, BIOME_SOUL_SAND_VALLEY), 1, 0), 8, 8)

# Water writes its data directly. Glass contributes no RGB data but uses its
# alpha to attenuate the marker, hiding water beneath opaque frame pixels while
# retaining it through the transparent centre of each pane.
blend.gbuffers_water.colortex2=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# The emission buffer keeps visible lava/fire glow while translucent surfaces
# attenuate sources behind them by their own opacity.
blend.gbuffers_water.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Cull geometry which cannot cast a shadow into the current view. The extended
# shadow radius therefore follows the player's visible scene instead of spending
# the same geometry budget behind the camera.
shadow.culling=true
