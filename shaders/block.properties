# Warm and soul-fire emitters use separate material groups. Campfires are only
# emissive while lit; extinguished campfires retain their normal wood shading.
block.10010=minecraft:lava
block.10011=minecraft:fire minecraft:campfire:lit=true
block.10012=minecraft:soul_fire minecraft:soul_campfire:lit=true
